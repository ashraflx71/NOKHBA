name: NOKHBA Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Check application files
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check products.js
          node --check products-multi.js
          node --check service-worker.js

      - name: Verify essential site files
        run: |
          test -s index.html
          test -s style.css
          test -s manifest.json
          test -s service-worker.js
